name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the WSD file
        run: |
          URL='https://www.esd.wsd.gov.hk/wsms_open_data/WSMS_OPEN_DATA(all).csv'
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          curl -sS -m 30 -A "$UA" -o wsd.csv -w "status=%{http_code} size=%{size_download} ip=%{remote_ip}\n" "$URL" || echo "CURL FAILED rc=$?"
          head -c 200 wsd.csv | head -1 || true
