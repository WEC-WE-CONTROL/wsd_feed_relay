name: mirror
# GitHub's own schedule can lag for hours on a new repository, so this workflow also keeps ITSELF going: each run
# checks the file every 10 minutes for about 5.5 hours and then starts the next run (workflow_dispatch started with
# GITHUB_TOKEN is allowed to start a run). The cron line is the backup if the chain is ever broken.
on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:
    inputs:
      iterations:
        description: 'checks in this run'
        default: '33'
      interval_seconds:
        description: 'seconds between checks'
        default: '600'
permissions:
  contents: write
  actions: write
concurrency:
  group: mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Check, commit when changed, wait, repeat
        env:
          GH_TOKEN: ${{ github.token }}
          ITERATIONS: ${{ inputs.iterations || '1' }}
          INTERVAL: ${{ inputs.interval_seconds || '600' }}
        run: |
          git config user.name "wsd-feed-relay"
          git config user.email "wsd-feed-relay@users.noreply.github.com"
          last=0
          for i in $(seq 1 "$ITERATIONS"); do
            if bash scripts/fetch_check.sh; then last=0; else last=1; echo "check $i failed"; fi
            git add wsms_open_data.csv status.json
            if git diff --cached --quiet; then echo "no change"; else
              git commit -q -m "mirror: WSD file checked $(date -u +%Y-%m-%dT%H:%MZ)"
              git pull -q --rebase origin main && git push -q || echo "push failed"
            fi
            [ "$i" -lt "$ITERATIONS" ] && sleep "$INTERVAL"
          done
          if [ "$ITERATIONS" -gt 1 ]; then gh workflow run mirror.yml --field iterations=33 --field interval_seconds=600; fi
          exit "$last"
